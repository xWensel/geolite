<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>La mesa de contenido</title>

<!-- MAQUETA de la mesa de contenido: consola del desarrollador y de quien balancea Geolite. Lee los datos reales de ../data/*.js (solo lectura).
     Lo que decides (Bien / No / Cambiar…, cortes de dificultad y sus versiones) se guarda en mesa/notas-contenido.json con el servidor local
     (CONTENIDO-mesa.bat) para que Claude lo lea y lo aplique; sin servidor se queda en este navegador. Codigo: contenido.js. -->
</head>
<body>
<div class="app">
  <nav class="side"><div class="brand">LA MESA DE CONTENIDO</div><div class="sub">Geolite · maqueta</div><div id="nav" style="display:grid;gap:3px"></div></nav>
  <div class="main">
    <div class="top"><button class="find" id="find">Buscar… <span class="keys">/ o Ctrl K</span></button><span class="sp"></span><button class="chip" id="scen" data-act="scen" style="cursor:pointer" title="Cambia entre ver lo de hoy y ver cómo quedaría con tus Bien y No"></button><span class="chip" id="cuts"></span><span class="chip" id="nvotes"></span><span class="chip" id="net">…</span><a class="lbl" href="index.html" style="color:var(--sub);text-decoration:underline">La mesa del crupier</a></div>
    <div id="livebar" style="display:none;gap:12px;align-items:center;padding:10px 18px;background:var(--gold);color:var(--inkd);font-family:var(--mono);font-size:13px">Los datos del juego han cambiado en disco. <button class="btn ghost" data-act="reload">Recargar</button></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="shade"></div><aside id="drawer"></aside><div id="toast"></div>
<script src="../data/places.js"></script><script src="../data/paises-lugares.js"></script><script src="../data/dificultad.js"></script><script src="../data/niveles.js"></script>
<script src="../data/pistas.js"></script><script src="../data/duelo-personas.js"></script><script src="../data/duelo-extra.js"></script><script src="../data/duelo-niveles.js"></script>
<script src="../data/codex.js"></script><script src="contenido-datos.js"></script><script src="contenido-senales.js"></script><script src="contenido-sugerencias.js"></script><script src="contenido-sug-senales.js"></script>
<script src="contenido.js"></script>
</body>
