<!-- Modo daltonico: simula la vision daltonica y le suma la diferencia con el original (feComposite),
     lo que separa los colores que esa vision confunde. Los aplica game.js sobre document.body.style.filter. -->
<svg id="cbDefs" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="cbFix_protan" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0" result="sim"/>
      <feComposite in="SourceGraphic" in2="sim" operator="arithmetic" k1="0" k2="2" k3="-1" k4="0"/>
    </filter>
    <filter id="cbFix_deutan" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0" result="sim"/>
      <feComposite in="SourceGraphic" in2="sim" operator="arithmetic" k1="0" k2="2" k3="-1" k4="0"/>
    </filter>
    <filter id="cbFix_tritan" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0" result="sim"/>
      <feComposite in="SourceGraphic" in2="sim" operator="arithmetic" k1="0" k2="2" k3="-1" k4="0"/>
    </filter>
  </defs>
</svg>
